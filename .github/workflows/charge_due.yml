name: Daily Supabase Charge

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC ≈ 7:00 AM ET
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Supabase Edge Function
        env:
          FUNCTION_URL: ${{ secrets.FUNCTION_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e
          : "${FUNCTION_URL:?Missing FUNCTION_URL secret}"
          : "${CRON_TOKEN:?Missing CRON_TOKEN secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"

          HTTP_STATUS=$(curl --show-error -s -X POST \
            "$FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -d "{\"cron_token\":\"${CRON_TOKEN}\"}" \
            -o response.json \
            -w "%{http_code}")

          CORRELATION_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "charge_due correlation_id=$CORRELATION_ID status=$HTTP_STATUS"

          test "$HTTP_STATUS" -ge 200
          test "$HTTP_STATUS" -lt 300
